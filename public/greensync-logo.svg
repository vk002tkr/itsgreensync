<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <!-- Gradients for 3D effect -->
    <linearGradient id="leafGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8ff4a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#6ee849;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d8659;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="leafGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64dd89;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3db86a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a6d3a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="leafGradient3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10a152;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64dd89;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filters -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="280" height="280" fill="transparent"/>
  
  <!-- Left curved leaf (G shape) -->
  <g filter="url(#shadow)">
    <!-- Main shape -->
    <path d="M 75 70 Q 50 90 50 140 Q 50 190 100 210 Q 130 220 145 200 L 145 180 Q 130 185 115 185 Q 85 185 85 140 Q 85 100 105 85 Q 125 75 145 85 L 145 65 Q 120 50 75 70 Z" 
          fill="url(#leafGradient1)" opacity="0.95"/>
    
    <!-- Inner shadow for depth -->
    <path d="M 80 80 Q 65 95 65 140 Q 65 180 100 195 Q 120 202 138 190 L 138 175 Q 125 180 110 180 Q 88 180 88 140 Q 88 105 105 92 Q 120 84 137 90 L 137 72 Q 115 60 80 80 Z" 
          fill="#ffffff" opacity="0.08"/>
  </g>
  
  <!-- Right curved leaf (S shape) -->
  <g filter="url(#shadow)">
    <!-- Upper curve -->
    <path d="M 160 65 Q 200 50 230 75 Q 250 90 250 115 Q 245 135 210 145 L 210 165 Q 250 155 255 120 Q 260 80 230 55 Q 195 30 160 45 Z" 
          fill="url(#leafGradient2)" opacity="0.95"/>
    
    <!-- Lower curve -->
    <path d="M 175 145 Q 145 155 135 180 Q 125 205 145 225 Q 175 245 210 225 Q 235 210 240 180 L 220 175 Q 215 200 195 215 Q 170 230 155 215 Q 140 205 145 185 Q 155 165 185 160 Z" 
          fill="url(#leafGradient3)" opacity="0.95"/>
    
    <!-- Inner highlight -->
    <path d="M 175 70 Q 210 58 235 80 Q 250 92 248 110 Q 245 128 215 137 L 215 153 Q 248 145 252 115 Q 256 82 235 62 Q 205 40 173 53 Z" 
          fill="#ffffff" opacity="0.12"/>
  </g>
  
  <!-- Central GS text indicator (subtle) -->
  <g opacity="0.15">
    <text x="140" y="155" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="48" font-weight="800" text-anchor="middle" fill="#ffffff">GS</text>
  </g>
  
  <!-- Accent dots (synergy points) -->
  <circle cx="35" cy="100" r="4.5" fill="#a8ff4a" opacity="0.85" filter="url(#shadow)"/>
  <circle cx="260" cy="90" r="4" fill="#64dd89" opacity="0.8" filter="url(#shadow)"/>
  <circle cx="55" cy="215" r="3.5" fill="#10a152" opacity="0.75" filter="url(#shadow)"/>
  <circle cx="240" cy="235" r="4.5" fill="#6ee849" opacity="0.8" filter="url(#shadow)"/>
  
  <!-- Subtle connecting flow lines -->
  <path d="M 40 110 Q 100 130 160 145" stroke="#a8ff4a" stroke-width="1.5" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M 245 100 Q 200 160 170 200" stroke="#64dd89" stroke-width="1.5" fill="none" opacity="0.25" stroke-linecap="round"/>
</svg>